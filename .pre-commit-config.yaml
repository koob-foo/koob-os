# koob OS Pre-commit Hooks
# See https://pre-commit.com for more information
# Install with: pre-commit install

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      - id: check-license
        name: check License Headers
        entry: hack/check-license.sh
        language: script
        files: \.(go|sh|makefile)$
        exclude: ^tmp/
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run
        language: system
        types: [go]
        pass_filenames: false
      - id: go-test
        name: go-test
        entry: make test
        language: system
        types: [go]
        pass_filenames: false
      - id: govulncheck
        name: govulncheck
        entry: govulncheck ./...
        language: system
        types: [go]
        pass_filenames: false
